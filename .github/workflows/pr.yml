name: GhostLab CI and Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      directory: ${{ steps.target.outputs.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Choose publication directory
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo 'directory=main' >> "$GITHUB_OUTPUT"
          else
            test "$PR_NUMBER" -gt 0
            echo "directory=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        env:
          DIRECTORY: ${{ steps.target.outputs.directory }}
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/$DIRECTORY/"
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist
          retention-days: 7
  preview:
    name: Publish site
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ghostlab-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}${{ needs.verify.outputs.directory }}/
    steps:
      - name: Read published sites (never execute source here)
        uses: actions/checkout@v4
        with:
          ref: preview-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: site-build
          path: built
      - name: Reject obsolete source revisions
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'push') {
              const { data: ref } = await github.rest.git.getRef({
                ...context.repo, ref: 'heads/main'
              });
              if (ref.object.sha !== context.sha) {
                core.setFailed('Publicação cancelada: a main já tem commits mais recentes.');
              }
            } else {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.payload.pull_request.number
              });
              if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) {
                core.setFailed('Prévia cancelada: este PR foi fechado ou já tem commits mais recentes.');
              }
            }
      - name: Update only this publication directory
        env:
          DIRECTORY: ${{ needs.verify.outputs.directory }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$DIRECTORY" =~ ^(main|pr-[0-9]+)$ ]]
          test -f built/index.html
          rm -rf "published/$DIRECTORY"
          mkdir -p "published/$DIRECTORY"
          cp -R built/. "published/$DIRECTORY/"
          printf '%s\n' "$HEAD_SHA" > "published/$DIRECTORY/revision.txt"
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIRECTORY"
          git diff --cached --quiet || git commit -m "Publish $DIRECTORY at $HEAD_SHA"
          git push origin HEAD:preview-pages
      - name: Package static files without Git metadata
        run: |
          mkdir site
          git -C published archive HEAD | tar -x -C site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Link for reviewers
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          DIRECTORY: ${{ needs.verify.outputs.directory }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "### [Abrir $DIRECTORY](${PAGE_URL}$DIRECTORY/)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
